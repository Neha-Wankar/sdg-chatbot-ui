<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="rgb(65,116,192)"/>
  <!-- "S" letterform built from data/chart motif -->
  <!-- Top bar -->
  <rect x="9" y="8" width="14" height="3" rx="1.5" fill="white"/>
  <!-- Middle bar -->
  <rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="white"/>
  <!-- Bottom bar -->
  <rect x="9" y="21" width="14" height="3" rx="1.5" fill="white"/>
  <!-- Small accent dot top-right (Data indicator) -->
  <circle cx="24" cy="8" r="2.5" fill="rgb(180,210,255)"/>
</svg>
